<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finishers Circle | Gallery</title>
  <meta name="description" content="Photo gallery from Finishers Circle tournaments — the premier submission-only series in Belize." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>

  <!-- SCROLL PROGRESS -->
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

  <!-- NAVBAR -->
  <header class="main-header" id="mainHeader">
    <a href="index.html" class="nav-brand" aria-label="Finishers Circle Home">
      <img src="media/mini-logo.png" alt="Finishers Circle" class="nav-logo">
    </a>

    <nav class="navbar" id="mainNav" aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="index.html#about" class="nav-link">About</a></li>
        <li><a href="index.html#tournaments" class="nav-link">Tournaments</a></li>
        <li><a href="gallery.html" class="nav-link active">Gallery</a></li>
        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
      </ul>
    </nav>

    <a href="index.html#register" class="nav-register-btn" id="navRegisterLink">Register Now</a>

    <button class="hamburger" id="hamburger" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobileMenu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" id="mobileMenu" aria-hidden="true" role="dialog" aria-label="Mobile navigation">
    <button class="mobile-close" id="mobileClose" aria-label="Close navigation menu">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <nav aria-label="Mobile navigation">
      <ul class="mobile-nav-list">
        <li><a href="index.html" class="mobile-nav-link">Home</a></li>
        <li><a href="index.html#about" class="mobile-nav-link">About</a></li>
        <li><a href="index.html#tournaments" class="mobile-nav-link">Tournaments</a></li>
        <li><a href="gallery.html" class="mobile-nav-link">Gallery</a></li>
        <li><a href="index.html#contact" class="mobile-nav-link">Contact</a></li>
      </ul>
    </nav>
    <a href="index.html#register" class="mobile-register-btn">Register Now</a>
  </div>
  <div class="mobile-backdrop" id="mobileBackdrop" aria-hidden="true"></div>

  <!-- GALLERY HERO -->
  <section class="gallery-hero" aria-label="Gallery hero">
    <div class="hero-inner">
      <span class="section-label">Photo Archive</span>
      <h1>Tournament <span class="text-red">Gallery</span></h1>
      <p>Relive the most brutal, beautiful moments from our events.</p>
    </div>
  </section>

  <!-- GALLERY GRID -->
  <main class="gallery-main container" aria-label="Photo gallery">
    <section class="gallery-grid" id="galleryGrid" aria-label="Gallery images">
      <figure class="gallery-item">
        <img data-src="media/gallery1.jpg"  alt="Tournament competition action 1"  class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery2.jpg"  alt="Tournament competition action 2"  class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery3.jpg"  alt="Tournament competition action 3"  class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery4.jpg"  alt="Tournament competition action 4"  class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery5.jpg"  alt="Tournament competition action 5"  class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery6.jpg"  alt="Tournament competition action 6"  class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery7.jpg"  alt="Tournament competition action 7"  class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery8.jpg"  alt="Tournament competition action 8"  class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery9.jpg"  alt="Tournament competition action 9"  class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery10.jpg" alt="Tournament competition action 10" class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery11.jpg" alt="Tournament competition action 11" class="lazy">
      </figure>
      <figure class="gallery-item">
        <img data-src="media/gallery12.jpg" alt="Tournament competition action 12" class="lazy">
      </figure>
    </section>
  </main>

  <!-- FOOTER STRIP -->
  <footer class="gallery-footer">
    <div class="container">
      <p>&copy; 2026 Finishers Circle &middot; <a href="index.html">Return Home</a></p>
    </div>
  </footer>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lb-close" aria-label="Close viewer (Esc)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="lb-prev" aria-label="Previous image">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="lb-stage">
      <div class="lb-spinner" aria-hidden="true"></div>
      <img class="lb-img" src="" alt="">
    </div>
    <button class="lb-next" aria-label="Next image">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="lb-counter" aria-live="polite"></div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
